services:
  postgres:
    image: postgres:16-alpine
    container_name: lumber-link-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumber_link
      POSTGRES_USER: lumber_link
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumber_link -d lumber_link"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
